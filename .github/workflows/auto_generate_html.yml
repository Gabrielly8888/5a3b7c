name: Gerar HTML automático

on:
  push:
    branches:
      - main
      - master
    paths:
      - '**.py'
      - '**.xlsx'
      - '**.csv'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate HTML report
        run: python relatorio_upxdown_pagina_unica.py

      - name: Commit generated HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "relatorio upxdown.html"
          if ! git diff --cached --quiet; then
            git commit -m "chore: atualizar relatorio upxdown.html"
            git push
          else
            echo "Nenhuma alteração no HTML para enviar."
          fi
